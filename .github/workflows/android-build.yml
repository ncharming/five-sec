name: Android Build

# 触发：推送到 main/master、PR、以及手动运行（Actions 页面点 "Run workflow"）
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK（接受许可 + 确保 sdkmanager 可用）
        uses: android-actions/setup-android@v3

      - name: 安装 platform-35 / build-tools 35.0.0
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9（直接用 gradle 命令，无需 wrapper jar）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests（含 Robolectric；首次会下载 android-all）
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK（可直接安装；仅在构建成功时上传）
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: five-sec-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
