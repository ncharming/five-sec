name: Android Build

# 触发：推送到 main/master、PR、以及手动运行（Actions 页面点 "Run workflow"）
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像不再可靠预装 Android SDK（sdkmanager 已不在 PATH，setup-android action
      # 也随之失败），这里完全自举：下载官方 cmdline-tools -> 接受许可 -> 补装组件。
      - name: Set up Android SDK（自举 cmdline-tools + 接受许可 + 补装组件）
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9（直接用 gradle 命令，无需 wrapper jar）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          if gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; then
            echo "build ok"
          else
            status=$?
            tail -n 30 /tmp/build.log | while IFS= read -r line; do echo "::error::${line:0:380}"; done
            exit $status
          fi

      - name: Run unit tests（含 Robolectric；首次会下载 android-all）
        run: |
          set -o pipefail
          if gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; then
            echo "tests ok"
          else
            status=$?
            tail -n 30 /tmp/test.log | while IFS= read -r line; do echo "::error::${line:0:380}"; done
            exit $status
          fi

      - name: Upload debug APK（可直接安装；仅在构建成功时上传）
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: five-sec-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
